

  # Name of the Workflow.
name: Deploy

# When the workflow should run.
on:
  workflow_call:
  # push: whenever code is pushed to GitHub, the workflow automatically runs. 
  # workflow_call: when this workflow needs to be called from another workflow.
  # workflow_dispatch: whenever you want the workflow to be called manually 
  # schedule: whenever you want the workflow to run at a specific time.
  
# Jobs in workflow. 
jobs:
  code-checkout:
    runs-on: self-hosted

    # Steps in workflow.
    steps:
      - name: Clone Code
        uses: actions/checkout@v7
      - name: Deploy via Nginx
        run: |
          # Check if Nginx is installed
          if ! command -v nginx &> /dev/null; then
            echo "Nginx not found. Installing Nginx..."
            sudo apt-get update -y
            sudo apt-get install -y nginx
            sudo systemctl enable nginx
            sudo systemctl start nginx
          else
            echo "Nginx is already installed. Skipping installation."
          fi

          # Copy portfolio file to web root
          sudo cp vaibhav-godse-portfolio.html /var/www/html/index.html
          
      
      - name: Deploy the code
        run: echo "Code Deployed to AWS EC2 instance"
